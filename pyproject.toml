[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-evidence-workbench"
version = "0.1.0a1"
description = "Evidence-safe adapters and provenance-oriented building blocks for DFIR workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "WellKnitTech"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest==9.0.3", "jsonschema==4.26.0", "httpx==0.28.1", "pytest-asyncio==1.3.0"]
api = [
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "pydantic-settings==2.15.0",
    "psycopg[binary,pool]==3.3.4",
    "jsonschema==4.26.0",
    "cryptography==50.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
