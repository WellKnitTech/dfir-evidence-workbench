[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dfir-evidence-workbench"
version = "0.1.0a1"
description = "Evidence-safe adapters and provenance-oriented building blocks for DFIR workflows"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "WellKnitTech"}]
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.3.5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra"
