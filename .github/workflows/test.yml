name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          # Ephemeral CI-only database; no credential is persisted in the workflow.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: testuser
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Install test and api dependencies
        run: python -m pip install --disable-pip-version-check -e '.[test,api]'
      - name: Run tests
        env:
          # Ephemeral CI-only database; no credential is persisted in the workflow.
          DFIRWB_DATABASE_URL: postgresql://testuser@postgres:5432/testdb
        run: python -m pytest -q
      - name: Compile Python
        run: python -m compileall -q src tests
      - name: Scan for high-risk files
        run: |
          ! find . -type f \( -name '*.pem' -o -name '*.key' -o -name '*.p12' -o -name '*.pfx' -o -name '*.dmp' -o -name '*.raw' -o -name '*.e01' -o -name '*.E01' \) -print -quit | grep -q .
